name: Bug 报告
description: 程序出错、界面异常、数据不对，用这个模板
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索一下是否已有人报告同样的问题。
        如果涉及安全漏洞，**不要**在这里提交，请见 [SECURITY.md](https://github.com/xiao-ni-qiu/BoxFlow/blob/main/SECURITY.md)。

  - type: input
    id: version
    attributes:
      label: BoxFlow 版本
      description: 设置页底部或安装包文件名里的版本号
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - Windows 10（1809 以下）
        - 其他（请在补充说明里写明）
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 出问题的位置
      options:
        - 物料列表 / 筛选 / 搜索
        - 新建或编辑物料
        - 入库 / 出库 / 盘点
        - 导入 / 导出
        - 存放位置
        - 供应商
        - 概览统计
        - MCP / AI 接入
        - 设置 / 托盘 / 启动
        - 安装与卸载
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量写成「1. 点这里 2. 输入那个 3. 看到什么」的形式
      placeholder: |
        1. 打开「电子元器件」
        2. 关键词输入 STM32
        3. 把排序切到「库存从少到多」
        4. 列表第一行显示的位置是空的
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有报错弹窗的话把原文贴上来，截图更好
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: |
        数据量大概多少、是否用了导入、是否通过 MCP 写入过、是否改过数据目录。
        崩溃后可以在 `%APPDATA%\BoxFlow\logs` 找日志，粘贴相关片段（注意不要贴出访问令牌）。
    validations:
      required: false
