name: 功能建议
description: 想要新功能或改进现有体验，用这个模板
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        写清「你在什么场景下遇到什么问题」比只写「加个 XX 功能」有用得多 —— 场景决定了实现方式。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你平时怎么用 BoxFlow？这个需求出现在哪一步？
      placeholder: |
        我有一千多个型号，每次采购回来要按供应商拆成好几批入库，
        现在只能一个一个改供应商，很费时间。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做
      description: 描述你理想中的操作流程，界面草图也可以直接贴图
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现在怎么绕过去
      description: 目前用 Excel、用 MCP、手动操作之类的替代方案，以及为什么不够好
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 这个需求影响的模块
      options:
        - 物料与库存
        - 导入导出
        - 位置与供应商
        - 统计与报表
        - MCP / AI 接入
        - 界面与交互
        - 打包与安装
        - 其他
    validations:
      required: false
